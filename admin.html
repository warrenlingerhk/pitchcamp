

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - PitchCamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --cream:#F7EFDE; --navy:#2E4156; --slate:#7E93A6; --yellow:#F2B33D; --orange:#E07A2F; --red:#C6472E; --green:#2E7D5B; }
*{box-sizing:border-box}
body{background:var(--cream);color:var(--navy);font-family:'Nunito Sans',sans-serif;margin:0}
h1,h2,h3{font-family:'Poppins',sans-serif}
.wrap{width:min(1150px,94%);margin-inline:auto;padding:40px 0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.header h1{margin:0;font-size:2rem}
.btn{background:var(--navy);color:#fff;border:none;padding:10px 20px;border-radius:999px;font-weight:800;cursor:pointer;text-decoration:none;font-size:.9rem}
.btn:hover{background:#1E2F42}
.btn-danger{background:var(--red)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:40px}
.stat-card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 12px rgba(46,65,86,.08)}
.stat-card h3{margin:0 0 8px;font-size:.9rem;color:var(--slate);text-transform:uppercase;letter-spacing:1px}
.stat-card .num{font-size:2.5rem;font-weight:800;color:var(--navy);margin:0}

.section{background:#fff;border-radius:16px;padding:24px;margin-bottom:30px;box-shadow:0 4px 12px rgba(46,65,86,.08)}
.section h2{margin:0 0 20px;font-size:1.4rem;border-bottom:2px solid var(--cream);padding-bottom:10px}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px;color:var(--slate);font-size:.85rem;text-transform:uppercase;border-bottom:2px solid var(--cream)}
td{padding:12px;border-bottom:1px solid var(--cream);font-size:.95rem}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:800}
.badge-banned{background:#fee;color:var(--red)}
.badge-paid{background:#e6f4ea;color:var(--green)}
.badge-free{background:var(--cream);color:var(--slate)}

.report-actions{display:flex;gap:8px}
.btn-sm{padding:6px 12px;font-size:.8rem}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Admin Dashboard</h1>
    <a href="/" class="btn">Back to Site</a>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><h3>Total Users</h3><p class="num" id="stat-users">-</p></div>
    <div class="stat-card"><h3>Total Posts</h3><p class="num" id="stat-posts">-</p></div>
    <div class="stat-card"><h3>Open Reports</h3><p class="num" id="stat-reports">-</p></div>
    <div class="stat-card"><h3>Mod 1 Completed</h3><p class="num" id="stat-mod1">-</p></div>
  </div>

  <div class="section">
    <h2>Recent Reports</h2>
    <table id="reports-table">
      <thead><tr><th>Reporter</th><th>Reported User</th><th>Reason</th><th>Post Content</th><th>Actions</th></tr></thead>
      <tbody id="reports-body"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>All Users</h2>
    <table id="users-table">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th>Joined</th></tr></thead>
      <tbody id="users-body"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = '';

// Security Gate
if (localStorage.getItem('pc_is_admin') !== '1') {
  window.location.href = '/';
}

async function loadDashboard() {
  const token = localStorage.getItem('token');
  const headers = { 'Authorization': 'Bearer ' + token };

  // Load Stats
  try {
    const statsRes = await fetch(API_URL + '/api/admin/stats', { headers });
    if (statsRes.ok) {
      const stats = await statsRes.json();
      document.getElementById('stat-users').innerText = stats.users;
      document.getElementById('stat-posts').innerText = stats.posts;
      document.getElementById('stat-reports').innerText = stats.reports;
      document.getElementById('stat-mod1').innerText = stats.mod1;
    }
  } catch (e) { console.error(e); }

  // Load Reports
  try {
    const repRes = await fetch(API_URL + '/api/admin/reports', { headers });
    if (repRes.ok) {
      const reports = await repRes.json();
      const tbody = document.getElementById('reports-body');
      if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--slate)">No reports yet. Great job!</td></tr>';
      } else {
        tbody.innerHTML = reports.map(r => `
          <tr>
            <td>${r.reporter_name}</td>
            <td>${r.reported_user_name}</td>
            <td>${r.reason || 'No reason given'}</td>
            <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.post_content}</td>
            <td class="report-actions">
              <button class="btn btn-danger btn-sm" onclick="deletePost(${r.post_id})">Delete Post</button>
              <button class="btn btn-danger btn-sm" onclick="banUser(${r.user_id})">Ban User</button>
            </td>
          </tr>
        `).join('');
      }
    }
  } catch (e) { console.error(e); }

  // Load Users
  try {
    const userRes = await fetch(API_URL + '/api/admin/users', { headers });
    if (userRes.ok) {
      const users = await userRes.json();
      document.getElementById('users-body').innerHTML = users.map(u => `
        <tr>
          <td>#${u.user_number || '-'}</td>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>
            ${u.banned ? '<span class="badge badge-banned">Banned</span>' : '<span class="badge badge-paid">Active</span>'}
          </td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }
  } catch (e) { console.error(e); }
}

async function deletePost(postId) {
  if (!confirm('Delete this post?')) return;
  await fetch(API_URL + '/api/posts/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
    body: JSON.stringify({ post_id: postId })
  });
  loadDashboard();
}

async function banUser(userId) {
  if (!confirm('Ban this user?')) return;
  await fetch(API_URL + '/api/users/ban', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
    body: JSON.stringify({ user_id: userId })
  });
  loadDashboard();
}

loadDashboard();
</script>
</body>
</html>
